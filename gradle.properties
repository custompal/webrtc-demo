# ============================================================================
# Gradle / Android 构建属性
# 由 t14（Android 骨架）创建，随仓库提交。
# ============================================================================

# --- Gradle 自身 ---
# 宿主 7.1 GiB 内存且无 swap（契约 §3.3/风险 R6），故不开大堆；UTF-8 固定避免中文注释/日志乱码
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存关闭：externalNativeBuild(CMake) + AGP 8.5 在配置缓存下需额外适配，先保守关闭
org.gradle.configuration-cache=false
org.gradle.warning.mode=summary

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
# BuildConfig 生成由 app/build.gradle.kts 的 buildFeatures.buildConfig 显式开启

# --- Kotlin ---
kotlin.code.style=official
kotlin.incremental=true
# Kotlin 编译在 Gradle daemon 内执行（in-process），少起一个 JVM：
# 内存紧张（7.1 GiB 无 swap）时更稳；如需恢复独立编译 daemon，用
# `-Pkotlin.compiler.execution.strategy=daemon` 覆盖即可。
kotlin.compiler.execution.strategy=in-process

# ============================================================================
# 缓存 / 临时目录约定（重要：容器 $HOME 不可写、/tmp 下可执行文件被拒）
# ----------------------------------------------------------------------------
# gradle.properties **无法内插环境变量**，因此这里只能记录约定；
# 实际由 <WS>/env.sh（宿主机）或 <WS>/env-container.sh（容器）导出：
#
#   GRADLE_USER_HOME = <WS>/.gradle-home   # Gradle 缓存 + wrapper 发行版（否则会写 ~/.gradle 失败）
#   TMPDIR           = <WS>/tmp            # 编译/解压临时文件
#   ANDROID_HOME     = <WS>/android-sdk
#   ANDROID_NDK_HOME = <WS>/android-sdk/ndk/26.1.10909125
#   JAVA_HOME        = /usr/lib/jvm/java-17-openjdk-amd64 （**仅宿主机**）
#
# 注意：JDK/SDK/NDK/cmake/ninja 只装在宿主机；容器内 rootfs 只读、无 JDK，
#       因此**容器内无法执行 Gradle/APK 构建**，构建须在宿主机跑：
#           . /opt/dsh-workspaces/env.sh && ./gradlew :app:assembleDebug
# 详见 reports/14-android-skeleton.md §9「环境与目录约定」。
# ============================================================================

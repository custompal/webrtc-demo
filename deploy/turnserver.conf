# ===== webrtc-demo coturn configuration =====
# Spec: code/webrtc-demo/doc/01-cloud-infra.md section 5
# Public IP (measured): 47.238.144.66   Internal IP (measured): 172.21.0.219
# Deployed to /etc/turnserver.conf on the host by task t6 (coturn-installer).
# NOTE: doc/01 section 5 says relay-ip=<public-ip>; that does NOT work (errno 99 /
# Allocate 508). relay-ip must be the LOCAL (internal) address; the public relay
# address is advertised via external-ip. See reports/06-coturn.md section 4.
listening-port=3478
listening-ip=172.21.0.219
external-ip=47.238.144.66/172.21.0.219
relay-ip=172.21.0.219
min-port=49152
max-port=49200
realm=webrtc-demo
server-name=webrtc-demo
use-fingerprint
lt-cred-mech
user=demo:demopass
total-quota=100
cert=/etc/turnserver/cert.pem
pkey=/etc/turnserver/pkey.pem

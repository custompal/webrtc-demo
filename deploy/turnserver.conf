# ===== webrtc-demo coturn configuration =====
# Spec: code/webrtc-demo/doc/01-cloud-infra.md section 5
# Public IP (measured): 47.238.144.66   Internal IP (measured): 172.21.0.219
listening-port=3478
listening-ip=172.21.0.219
external-ip=47.238.144.66/172.21.0.219
relay-ip=172.21.0.219
min-port=49152
max-port=49200
realm=webrtc-demo
server-name=webrtc-demo
# use-fingerprint   # t58: coturn 4.6.1 不认识该名（启动日志 Bad configuration format），实际未生效；正确名为 fingerprint（见报告）
fingerprint
lt-cred-mech
user=demo:demopass
total-quota=45
cert=/etc/turnserver/cert.pem
pkey=/etc/turnserver/pkey.pem

# captain 2026-09-14: 真机连通性定因期间开启 verbose（可回滚：/etc/turnserver.conf.bak-pre-verbose）
verbose

# ===== t58 (2026-09-15) 4G↔WiFi 中继诊断：对等端地址策略与配额 =====
# 实测（turnperm 探针矩阵）：coturn 4.6.1 内建默认只拒绝 this-network 0.0.0.0/8 与
# loopback 127.0.0.0/8；RFC1918/CGNAT/link-local/组播/公网 一律允许。
# ① 显式固化拒绝（与内建默认一致，仅作文档化；**不要**放行 loopback：
#    TURN 中继到 127.0.0.1 会让任意客户端经本机 8080/5766 等服务打洞 = SSRF）。
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# ② 显式放行 4G↔WiFi 场景真正需要的对等地址段（默认已允许，此处固化防止默认表变化）
allowed-peer-ip=10.0.0.0-10.255.255.255
allowed-peer-ip=172.16.0.0-172.31.255.255
allowed-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=100.64.0.0-100.127.255.255
allowed-peer-ip=169.254.0.0-169.254.255.255
# ③ 配额与中继端口池对齐：relay 端口 49152-49200 共 49 个，
#    原 total-quota=100 永远先撞端口池；收紧为 45（留 4 个余量）并加 per-user=8，
#    避免反复重连测试时单客户端占满端口池。
user-quota=8
max-allocate-lifetime=600
